services:
  db:
    image: postgres:16-alpine
    container_name: catalpa-pg
    environment:
      POSTGRES_USER: catalpa
      POSTGRES_PASSWORD: catalpa
      POSTGRES_DB: catalpa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalpa"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalpa-vue-app
    command: sh -c "node server/http.js & pnpm dev --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=3001
      - DATA_DIR=/app/.data
      # When Postgres is desired, point the server at it. The file repository
      # is used automatically if DATABASE_URL is unset/unreachable.
      - DATABASE_URL=postgres://catalpa:catalpa@db:5432/catalpa
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  pnpm_store:
